<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="870" viewBox="0 0 1320 870" font-family="'Amazon Ember',DejaVu Sans,Arial,Helvetica,sans-serif"><rect x="0" y="0" width="1320" height="870" fill="#FFFFFF"/><text x="660" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#232F3E">Application-team responsibility matrix</text><text x="660" y="82" text-anchor="middle" font-size="15" font-weight="400" fill="#5A6B7B">What a team inherits from the enclave vs. what it brings and authorizes for its own agent</text><rect x="90" y="120" width="560" height="56" rx="10" fill="#232F3E"/><text x="120" y="146" text-anchor="start" font-size="18" font-weight="700" fill="#FF9900">Inherited from the enclave</text><text x="120" y="166" text-anchor="start" font-size="12.5" font-weight="400" fill="#C7D0D9">platform team operates it — pre-built, not rebuilt per team</text><rect x="90" y="206" width="560" height="46" rx="8" fill="#F4F6F8" stroke="#D9DFE5" stroke-width="1"/><circle cx="118" cy="229" r="12" fill="#232F3E"/><polyline points="112.3,229 117.05,234.7 125.6,222.35" fill="none" stroke="#FF9900" stroke-width="2.4699999999999998" stroke-linecap="round" stroke-linejoin="round"/><text x="142" y="235" text-anchor="start" font-size="13.5" font-weight="600" fill="#232F3E">Baseline Bedrock guardrail (account-enforced)</text><rect x="90" y="260" width="560" height="46" rx="8" fill="#F4F6F8" stroke="#D9DFE5" stroke-width="1"/><circle cx="118" cy="283" r="12" fill="#232F3E"/><polyline points="112.3,283 117.05,288.7 125.6,276.35" fill="none" stroke="#FF9900" stroke-width="2.4699999999999998" stroke-linecap="round" stroke-linejoin="round"/><text x="142" y="289" text-anchor="start" font-size="13.5" font-weight="600" fill="#232F3E">Identity framework &amp; gateway JWT authorizer</text><rect x="90" y="314" width="560" height="46" rx="8" fill="#F4F6F8" stroke="#D9DFE5" stroke-width="1"/><circle cx="118" cy="337" r="12" fill="#232F3E"/><polyline points="112.3,337 117.05,342.7 125.6,330.35" fill="none" stroke="#FF9900" stroke-width="2.4699999999999998" stroke-linecap="round" stroke-linejoin="round"/><text x="142" y="343" text-anchor="start" font-size="13.5" font-weight="600" fill="#232F3E">Tenant-isolation SCPs / RCPs &amp; data perimeter</text><rect x="90" y="368" width="560" height="46" rx="8" fill="#F4F6F8" stroke="#D9DFE5" stroke-width="1"/><circle cx="118" cy="391" r="12" fill="#232F3E"/><polyline points="112.3,391 117.05,396.7 125.6,384.35" fill="none" stroke="#FF9900" stroke-width="2.4699999999999998" stroke-linecap="round" stroke-linejoin="round"/><text x="142" y="397" text-anchor="start" font-size="13.5" font-weight="600" fill="#232F3E">Model allow-list &amp; same-geo inference profiles</text><rect x="90" y="422" width="560" height="46" rx="8" fill="#F4F6F8" stroke="#D9DFE5" stroke-width="1"/><circle cx="118" cy="445" r="12" fill="#232F3E"/><polyline points="112.3,445 117.05,450.7 125.6,438.35" fill="none" stroke="#FF9900" stroke-width="2.4699999999999998" stroke-linecap="round" stroke-linejoin="round"/><text x="142" y="451" text-anchor="start" font-size="13.5" font-weight="600" fill="#232F3E">Encryption keys (enclave CMK)</text><rect x="90" y="476" width="560" height="46" rx="8" fill="#F4F6F8" stroke="#D9DFE5" stroke-width="1"/><circle cx="118" cy="499" r="12" fill="#232F3E"/><polyline points="112.3,499 117.05,504.7 125.6,492.35" fill="none" stroke="#FF9900" stroke-width="2.4699999999999998" stroke-linecap="round" stroke-linejoin="round"/><text x="142" y="505" text-anchor="start" font-size="13.5" font-weight="600" fill="#232F3E">Network: VPC, interface &amp; gateway endpoints</text><rect x="90" y="530" width="560" height="46" rx="8" fill="#F4F6F8" stroke="#D9DFE5" stroke-width="1"/><circle cx="118" cy="553" r="12" fill="#232F3E"/><polyline points="112.3,553 117.05,558.7 125.6,546.35" fill="none" stroke="#FF9900" stroke-width="2.4699999999999998" stroke-linecap="round" stroke-linejoin="round"/><text x="142" y="559" text-anchor="start" font-size="13.5" font-weight="600" fill="#232F3E">Logging, CloudTrail, Config &amp; conformance packs</text><rect x="90" y="584" width="560" height="46" rx="8" fill="#F4F6F8" stroke="#D9DFE5" stroke-width="1"/><circle cx="118" cy="607" r="12" fill="#232F3E"/><polyline points="112.3,607 117.05,612.7 125.6,600.35" fill="none" stroke="#FF9900" stroke-width="2.4699999999999998" stroke-linecap="round" stroke-linejoin="round"/><text x="142" y="613" text-anchor="start" font-size="13.5" font-weight="600" fill="#232F3E">Token budgets &amp; the fail-closed meter</text><rect x="90" y="638" width="560" height="46" rx="8" fill="#F4F6F8" stroke="#D9DFE5" stroke-width="1"/><circle cx="118" cy="661" r="12" fill="#232F3E"/><polyline points="112.3,661 117.05,666.7 125.6,654.35" fill="none" stroke="#FF9900" stroke-width="2.4699999999999998" stroke-linecap="round" stroke-linejoin="round"/><text x="142" y="667" text-anchor="start" font-size="13.5" font-weight="600" fill="#232F3E">Backup, detective controls, account baseline</text><rect x="90" y="692" width="560" height="46" rx="8" fill="#F4F6F8" stroke="#D9DFE5" stroke-width="1"/><circle cx="118" cy="715" r="12" fill="#232F3E"/><polyline points="112.3,715 117.05,720.7 125.6,708.35" fill="none" stroke="#FF9900" stroke-width="2.4699999999999998" stroke-linecap="round" stroke-linejoin="round"/><text x="142" y="721" text-anchor="start" font-size="13.5" font-weight="600" fill="#232F3E">The FedRAMP / HIPAA control baseline &amp; evidence</text><rect x="710" y="120" width="560" height="56" rx="10" fill="#FF9900"/><text x="740" y="146" text-anchor="start" font-size="18" font-weight="700" fill="#232F3E">The application team owns &amp; authorizes</text><text x="740" y="166" text-anchor="start" font-size="12.5" font-weight="400" fill="#232F3E">its own workload — and its agency’s full requirement scope</text><rect x="710" y="206" width="560" height="46" rx="8" fill="#FFE1B3" stroke="#FFC266" stroke-width="1"/><circle cx="738" cy="229" r="11" fill="#FF9900"/><circle cx="738" cy="229" r="4" fill="#232F3E"/><text x="760" y="226" text-anchor="start" font-size="13.3" font-weight="700" fill="#232F3E">Application &amp; agent code</text><text x="760" y="243" text-anchor="start" font-size="11.3" font-weight="400" fill="#6b5636">attach guardrail, wrap user input in guardContent</text><rect x="710" y="260" width="560" height="46" rx="8" fill="#FFE1B3" stroke="#FFC266" stroke-width="1"/><circle cx="738" cy="283" r="11" fill="#FF9900"/><circle cx="738" cy="283" r="4" fill="#232F3E"/><text x="760" y="280" text-anchor="start" font-size="13.3" font-weight="700" fill="#232F3E">Its data</text><text x="760" y="297" text-anchor="start" font-size="11.3" font-weight="400" fill="#6b5636">retrieval content, memory actor/session ids</text><rect x="710" y="314" width="560" height="46" rx="8" fill="#FFE1B3" stroke="#FFC266" stroke-width="1"/><circle cx="738" cy="337" r="11" fill="#FF9900"/><circle cx="738" cy="337" r="4" fill="#232F3E"/><text x="760" y="334" text-anchor="start" font-size="13.3" font-weight="700" fill="#232F3E">OIDC app client (JWT identity)</text><text x="760" y="351" text-anchor="start" font-size="11.3" font-weight="400" fill="#6b5636">register in the org IdP; enforce MFA; team-claim groups</text><rect x="710" y="368" width="560" height="46" rx="8" fill="#FFE1B3" stroke="#FFC266" stroke-width="1"/><circle cx="738" cy="391" r="11" fill="#FF9900"/><circle cx="738" cy="391" r="4" fill="#232F3E"/><text x="760" y="388" text-anchor="start" font-size="13.3" font-weight="700" fill="#232F3E">Scoped execution role</text><text x="760" y="405" text-anchor="start" font-size="11.3" font-weight="400" fill="#6b5636">one customer-managed policy, no inline, least-privilege</text><rect x="710" y="422" width="560" height="46" rx="8" fill="#FFE1B3" stroke="#FFC266" stroke-width="1"/><circle cx="738" cy="445" r="11" fill="#FF9900"/><circle cx="738" cy="445" r="4" fill="#232F3E"/><text x="760" y="442" text-anchor="start" font-size="13.3" font-weight="700" fill="#232F3E">Container image</text><text x="760" y="459" text-anchor="start" font-size="11.3" font-weight="400" fill="#6b5636">linux/arm64, immutable tag, pushed to the enclave ECR</text><rect x="710" y="476" width="560" height="46" rx="8" fill="#FFE1B3" stroke="#FFC266" stroke-width="1"/><circle cx="738" cy="499" r="11" fill="#FF9900"/><circle cx="738" cy="499" r="4" fill="#232F3E"/><text x="760" y="496" text-anchor="start" font-size="13.3" font-weight="700" fill="#232F3E">Tool Lambdas</text><text x="760" y="513" text-anchor="start" font-size="11.3" font-weight="400" fill="#6b5636">in-VPC, KMS DLQ &amp; env, X-Ray, reserved concurrency</text><rect x="710" y="530" width="560" height="46" rx="8" fill="#FFE1B3" stroke="#FFC266" stroke-width="1"/><circle cx="738" cy="553" r="11" fill="#FF9900"/><circle cx="738" cy="553" r="4" fill="#232F3E"/><text x="760" y="550" text-anchor="start" font-size="13.3" font-weight="700" fill="#232F3E">Gateway tool registration</text><text x="760" y="567" text-anchor="start" font-size="11.3" font-weight="400" fill="#6b5636">target + Cedar policy (or interceptor rule) per tool</text><rect x="710" y="584" width="560" height="46" rx="8" fill="#FFE1B3" stroke="#FFC266" stroke-width="1"/><circle cx="738" cy="607" r="11" fill="#FF9900"/><circle cx="738" cy="607" r="4" fill="#232F3E"/><text x="760" y="604" text-anchor="start" font-size="13.3" font-weight="700" fill="#232F3E">Runtime via the SGEA wrapper</text><text x="760" y="621" text-anchor="start" font-size="11.3" font-weight="400" fill="#6b5636">JWT inputs, header allow-list, VPCE restriction</text><rect x="710" y="638" width="560" height="46" rx="8" fill="#FFE1B3" stroke="#FFC266" stroke-width="1"/><circle cx="738" cy="661" r="11" fill="#FF9900"/><circle cx="738" cy="661" r="4" fill="#232F3E"/><text x="760" y="658" text-anchor="start" font-size="13.3" font-weight="700" fill="#232F3E">sgea:tenant / sgea:profile tags</text><text x="760" y="675" text-anchor="start" font-size="11.3" font-weight="400" fill="#6b5636">case-sensitive keys on every resource — the isolation SCP compares them exactly</text><rect x="710" y="692" width="560" height="46" rx="8" fill="#FFE1B3" stroke="#FFC266" stroke-width="1"/><circle cx="738" cy="715" r="11" fill="#FF9900"/><circle cx="738" cy="715" r="4" fill="#232F3E"/><text x="760" y="712" text-anchor="start" font-size="13.3" font-weight="700" fill="#232F3E">Full requirement scope &amp; ATO</text><text x="760" y="729" text-anchor="start" font-size="11.3" font-weight="400" fill="#6b5636">policy/process controls + its own authorization</text><rect x="90" y="756" width="1180" height="64" rx="10" fill="#232F3E"/><text x="660" y="780" text-anchor="middle" font-size="15.5" font-weight="700" fill="#FFFFFF">18-item tenant onboarding checklist</text><text x="660" y="802" text-anchor="middle" font-size="12.5" font-weight="400" fill="#C7D0D9">every item is enforced by the enclave or evaluated by the conformance packs — the team still carries its own full requirement scope and authorization</text><text x="660" y="842" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5A6B7B">Secure GenAI Enclave Accelerator (SGEA)  ·  tenant onboarding (docs/operations/tenant-onboarding.md)</text></svg>