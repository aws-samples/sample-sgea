<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="680" viewBox="0 0 1300 680" font-family="'Amazon Ember',DejaVu Sans,Arial,Helvetica,sans-serif"><rect x="0" y="0" width="1300" height="680" fill="#FFFFFF"/><text x="650" y="56" text-anchor="middle" font-size="26" font-weight="700" fill="#232F3E">Four-layer shared responsibility for agentic AI</text><text x="650" y="86" text-anchor="middle" font-size="14.5" font-weight="400" fill="#5A6B7B">The enclave is built once and shared — each team builds only its own layer; the ISSO / AO makes the compliance determination</text><rect x="90" y="120" width="760" height="92" rx="9" fill="#232F3E"/><text x="116" y="158" text-anchor="start" font-size="19" font-weight="700" fill="#FFFFFF">ISSO / Authorizing Official</text><text x="116" y="184" text-anchor="start" font-size="13.5" font-weight="400" fill="#C7D0D9">Oversight, acceptance, continuous monitoring</text><rect x="628" y="150.0" width="202" height="32" rx="16" fill="#1b2531" stroke="#FF9900" stroke-width="1.4"/><text x="729.0" y="171.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FF9900">Determines compliance</text><rect x="84" y="218" width="772" height="132" rx="10" fill="#FFE1B3"/><rect x="90" y="224" width="760" height="120" rx="9" fill="#FF9900"/><text x="116" y="262" text-anchor="start" font-size="19" font-weight="700" fill="#232F3E">Application team (tenant)</text><text x="116" y="288" text-anchor="start" font-size="13.5" font-weight="400" fill="#232F3E">Its application, data and configuration</text><rect x="653" y="268.0" width="177" height="32" rx="16" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.4"/><text x="741.5" y="289.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#232F3E">Owns its own layer</text><rect x="90" y="356" width="760" height="150" rx="9" fill="#232F3E"/><text x="116" y="394" text-anchor="start" font-size="19" font-weight="700" fill="#FFFFFF">Platform team — the enclave</text><text x="116" y="420" text-anchor="start" font-size="13.5" font-weight="400" fill="#C7D0D9">Guardrails · logging · isolation · keys · network</text><rect x="538" y="415.0" width="292" height="32" rx="16" fill="#1b2531" stroke="#FF9900" stroke-width="1.4"/><text x="684.0" y="436.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FF9900">Operated once, shared by tenants</text><rect x="90" y="518" width="760" height="96" rx="9" fill="#232F3E"/><text x="116" y="556" text-anchor="start" font-size="19" font-weight="700" fill="#FFFFFF">AWS</text><text x="116" y="582" text-anchor="start" font-size="13.5" font-weight="400" fill="#C7D0D9">The cloud service controls</text><rect x="653" y="550.0" width="177" height="32" rx="16" fill="#1b2531" stroke="#FF9900" stroke-width="1.4"/><text x="741.5" y="571.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FF9900">Inherited from AWS</text><path d="M 884 356 q 14 0 14 16 l 0 97.0 q 0 16 14 16 q -14 0 -14 16 l 0 97.0 q 0 16 -14 16" fill="none" stroke="#FF9900" stroke-width="2.4"/><rect x="920" y="120" width="310" height="176" rx="12" fill="#F4F6F8" stroke="#D9DFE5" stroke-width="1"/><text x="1075.0" y="156" text-anchor="middle" font-size="17" font-weight="700" fill="#232F3E">Less for each team to build</text><text x="1075.0" y="186" text-anchor="middle" font-size="13" font-weight="400" fill="#5A6B7B">Tenants inherit the enclave’s controls</text><text x="1075.0" y="206" text-anchor="middle" font-size="13" font-weight="400" fill="#5A6B7B">instead of rebuilding them — reduced,</text><text x="1075.0" y="226" text-anchor="middle" font-size="13" font-weight="400" fill="#5A6B7B">not eliminated. Policy, process and</text><text x="1075.0" y="246" text-anchor="middle" font-size="13" font-weight="400" fill="#5A6B7B">organizational controls stay with</text><text x="1075.0" y="266" text-anchor="middle" font-size="13" font-weight="400" fill="#5A6B7B">the organization.</text><rect x="920" y="314" width="310" height="300" rx="12" fill="#232F3E"/><text x="1075.0" y="346" text-anchor="middle" font-size="15" font-weight="700" fill="#FF9900">What SGEA checks</text><text x="1075.0" y="368" text-anchor="middle" font-size="12" font-weight="400" fill="#C7D0D9">across the 9 framework baselines</text><text x="982" y="414" text-anchor="end" font-size="28" font-weight="700" fill="#FFFFFF">181</text><text x="998" y="404" text-anchor="start" font-size="12.5" font-weight="400" fill="#C7D0D9">conformance-pack rules</text><text x="998" y="421" text-anchor="start" font-size="12.5" font-weight="400" fill="#C7D0D9">checked or dispositioned</text><text x="982" y="466" text-anchor="end" font-size="28" font-weight="700" fill="#FFFFFF">44</text><text x="998" y="456" text-anchor="start" font-size="12.5" font-weight="400" fill="#C7D0D9">SGEA Bedrock / AgentCore</text><text x="998" y="473" text-anchor="start" font-size="12.5" font-weight="400" fill="#C7D0D9">controls (ISSO review)</text><text x="982" y="518" text-anchor="end" font-size="28" font-weight="700" fill="#FFFFFF">0</text><text x="998" y="508" text-anchor="start" font-size="12.5" font-weight="400" fill="#C7D0D9">open coverage gaps</text><text x="1075.0" y="570" text-anchor="middle" font-size="11.5" font-weight="400" fill="#8A97A5">Evaluates the IaC — does not</text><text x="1075.0" y="587" text-anchor="middle" font-size="11.5" font-weight="400" fill="#8A97A5">make the system compliant</text><text x="650" y="654" text-anchor="middle" font-size="12.5" font-weight="600" fill="#5A6B7B">Secure GenAI Enclave Accelerator (SGEA)</text></svg>