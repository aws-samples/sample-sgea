# Documented exceptions: enclave resources AWS Config will report NON_COMPLIANT by design, with the reason.
# tools/collect_evidence.py marks matching live findings "exception" (not a deviation); docs/CONTROL-COVERAGE.md
# lists them. `resource` is a glob over the Config resource id; `<env>` = the enclave env name.
exceptions:
  - {rule: s3-bucket-default-lock-enabled, resource: "sgea-<env>-config-*", reason: "AWS Config delivery bucket: S3 rejects writes to Object Lock buckets without a checksum header and the AWS Config writer sends none (verified: InsufficientDeliveryPolicyException). Otherwise identical hardening."}
  - {rule: s3-bucket-default-lock-enabled, resource: "sgea-<env>-access-logs-*", reason: "S3 server-access-log target: log delivery does not support Object Lock targets reliably; access logs are not the system of record."}
  - {rule: s3-bucket-replication-enabled, resource: "sgea-<env>-config-*", reason: "AWS Config retains configuration history itself; the delivery bucket is not replicated."}
  - {rule: s3-bucket-replication-enabled, resource: "sgea-<env>-access-logs-*", reason: "Access-log sink (and its replica-region twin) is not replicated: it records access to the replicated log store."}
  - {rule: s3-bucket-replication-enabled, resource: "sgea-<env>-logs-replica-*", reason: "Cross-region replica of the log store: it is the replication destination."}
  - {rule: s3-bucket-logging-enabled, resource: "sgea-<env>-access-logs-*", reason: "S3 server-access-log target cannot log to itself."}
  - {rule: s3-bucket-policy-grantee-check, resource: "sgea-<env>-config-*", reason: "Config delivery statement grants Principal * restricted by aws:PrincipalArn = the AWS Config service-linked role and the account (AWS's documented pattern for SLR delivery); the rule only matches literal principals."}
  - {rule: aurora-resources-protected-by-backup-plan, resource: "*", reason: "Time-dependent: AWS Backup counts a resource as protected once its first recovery point exists (daily plan, 05:00 UTC). The enclave Aurora cluster is in the backup selection from deploy."}
  - {rule: rds-resources-protected-by-backup-plan, resource: "*", reason: "Time-dependent (first recovery point); see aurora-resources-protected-by-backup-plan."}
  - {rule: dynamodb-resources-protected-by-backup-plan, resource: "*", reason: "Time-dependent (first recovery point); the token ledger is in the backup selection from deploy."}
  - {rule: s3-resources-protected-by-backup-plan, resource: "*", reason: "Time-dependent (first recovery point); the log / config stores are in the backup selection from deploy."}
  - {rule: s3-default-encryption-kms, resource: "sgea-<env>-access-logs-*", reason: "S3 server-access logging supports only SSE-S3 (AES256) destination buckets, not SSE-KMS (AWS S3 User Guide); the access-log sink uses SSE-S3 with versioning, TLS-only policy and Block Public Access."}
  - {rule: lambda-concurrency-check, owner: cdk-deploy-helper, resource: "*", reason: "CDK deploy helpers (AwsCustomResource provider, PropagationWait) run for seconds per deployment; reserving the pack's 500-1000 for each would exhaust account concurrency. Their log groups are CMK-encrypted with pack retention."}
  - {rule: lambda-inside-vpc, owner: cdk-deploy-helper, resource: "*", reason: "CDK deploy helpers call AWS control-plane APIs during deployment only; they handle no enclave data."}
  - {rule: lambda-dlq-check, owner: cdk-deploy-helper, resource: "*", reason: "CDK deploy helpers are invoked synchronously by CloudFormation; failures surface as stack events, not dead letters."}
  - {rule: cloudtrail-s3-dataevents-enabled, resource: "*", reason: "The enclave trail records S3 data events for every bucket except its own log store (resources.ARN NotStartsWith the log store): logging the trail's destination would record the trail's own writes in a feedback loop. Object-level access to the log store is recorded by its S3 server access logs (access-log sink), and the store is Object Lock / versioned, CMK-encrypted, replicated."}
  - {rule: dynamodb-in-backup-plan, resource: "*", reason: "Time-dependent: AWS Config can evaluate the new token-ledger table before the backup plan that selects it exists ('No backup plans are available for evaluation'); the periodic re-evaluation (24 h), or start-config-rules-evaluation after deploy (MANUAL-STEPS), turns it COMPLIANT."}
