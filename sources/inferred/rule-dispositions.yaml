# SGEA rule-disposition register (SGEA-authored; ISSO review required).
#
# EVERY AWS Config rule in EVERY conformance pack a baseline composes must be accounted for, either
#   (a) by a plan/CFN mapping in config-rule-plan-checks.json (evaluated by `sgea check`), or
#   (b) by exactly one entry here.
# tools/build_catalog.py fails when a rule has neither, or both (a mapped rule needs no disposition),
# so a framework control can no longer go silently missing. `docs/CONTROL-COVERAGE.md` is generated
# from the catalogs + this file.
#
# disposition:
#   implement              the enclave owns the resource: must be emitted (TF + CDK) and mapped. Open gap
#                          until then — `sgea check` reports it as GAP (counts as a required FAIL).
#   tenant                 the service is allowed for tenant apps (services.allow); the enclave emits no
#                          such resource. Config evaluates tenant resources at runtime.
#   not-in-enclave         the service is neither emitted nor allowed (the SCP denies it); vacuously
#                          compliant. Config still evaluates the account at runtime.
#   customer-prerequisite  account / identity / network baseline owned by the customer landing zone
#                          (Control Tower / LZA / the VPC owner). Listed in INSTALL prerequisites.
#   process                not a configuration (assessment, plan, exercise). Evidence via Audit Manager.
#   runtime-only           only observable on the live account (findings, rotation runs, snapshots).
#                          Config evaluates it; no deploy-time check is possible.
dispositions:
  # ---------- account / identity baseline (landing zone) ----------
  access-keys-rotated: {disposition: customer-prerequisite, reason: "IAM user access keys; the enclave creates no IAM users (roles only). Landing-zone identity baseline (IAM Identity Center)."}
  account-part-of-organizations: {disposition: customer-prerequisite, reason: "The enclave account must be an Organizations member (required for the SCP/RCP layer). Landing zone."}
  iam-group-has-users-check: {disposition: customer-prerequisite, reason: "IAM groups/users are not created by the enclave; identity via IAM Identity Center."}
  iam-root-access-key-check: {disposition: customer-prerequisite, reason: "Root user hygiene is an account baseline (Control Tower / LZA)."}
  iam-user-group-membership-check: {disposition: customer-prerequisite, reason: "No IAM users in the enclave; identity via IAM Identity Center."}
  iam-user-mfa-enabled: {disposition: customer-prerequisite, reason: "No IAM users in the enclave; identity via IAM Identity Center (MFA enforced there)."}
  iam-user-no-policies-check: {disposition: customer-prerequisite, reason: "No IAM users in the enclave."}
  iam-user-unused-credentials-check: {disposition: customer-prerequisite, reason: "No IAM users in the enclave."}
  mfa-enabled-for-iam-console-access: {disposition: customer-prerequisite, reason: "No IAM users in the enclave; console access via IAM Identity Center with MFA."}
  root-account-hardware-mfa-enabled: {disposition: customer-prerequisite, reason: "Root user MFA is an account baseline (Control Tower / LZA); cannot be set by IaC."}
  root-account-mfa-enabled: {disposition: customer-prerequisite, reason: "Root user MFA is an account baseline; cannot be set by IaC."}
  # ---------- customer VPC (supplied to the enclave as inputs) ----------
  internet-gateway-authorized-vpc-only: {disposition: customer-prerequisite, reason: "The enclave VPC is customer-supplied and must have no IGW (examples/sandbox-network has none)."}
  no-unrestricted-route-to-igw: {disposition: customer-prerequisite, reason: "Customer VPC routing; the enclave requires private subnets without IGW routes."}
  subnet-auto-assign-public-ip-disabled: {disposition: customer-prerequisite, reason: "Customer VPC subnets; the enclave requires private subnets (sandbox fixture complies)."}
  restricted-ssh: {disposition: customer-prerequisite, reason: "Security groups are customer inputs (endpoint / agent / Aurora SGs); the sandbox fixture opens no SSH."}
  restricted-common-ports: {disposition: customer-prerequisite, reason: "Security groups are customer inputs; the sandbox fixture allows only 443/5432 inside the VPC CIDR."}
  vpc-sg-open-only-to-authorized-ports: {disposition: customer-prerequisite, reason: "Security groups are customer inputs; no 0.0.0.0/0 ingress in the sandbox fixture."}
  vpc-vpn-2-tunnels-up: {disposition: customer-prerequisite, reason: "Site-to-site VPN (e.g. DoD BCAP path) is customer network; the enclave creates none."}
  # ---------- process (Audit Manager manual evidence) ----------
  annual-risk-assessment-performed: {disposition: process, reason: "Manual control (Audit Manager evidence): annual risk assessment."}
  response-plan-tested: {disposition: process, reason: "Manual control: incident-response plan exercise."}
  vuln-management-plan-exists: {disposition: process, reason: "Manual control: vulnerability-management plan."}
  # ---------- runtime-only ----------
  guardduty-non-archived-findings: {disposition: runtime-only, reason: "Operational: GuardDuty findings must be triaged within the window; the enclave enables GuardDuty (security-services)."}
  dynamodb-throughput-limit-check: {disposition: runtime-only, reason: "Account throughput vs. limit at runtime; the ledger is on-demand."}
  secretsmanager-scheduled-rotation-success-check: {disposition: runtime-only, reason: "Rotation outcome is only observable live; the Aurora admin secret is RDS-managed with rotation on."}
  rds-snapshots-public-prohibited: {disposition: runtime-only, reason: "Snapshots exist only at runtime; Aurora is private, and the snapshot-sharing block is set account-wide (see ebs-snapshot-public-restorable-check for EBS)."}
  s3-bucket-policy-grantee-check: {disposition: runtime-only, reason: "Pack leaves the allowed grantees unset (customer-specific); enclave bucket policies grant only AWS services / the account, with conditions (checked by s3-bucket-ssl-requests-only and PAB mappings)."}
  ec2-managedinstance-association-compliance-status-check: {disposition: not-in-enclave, reason: "No EC2 instances / SSM managed nodes in the enclave."}
  ec2-managedinstance-patch-compliance-status-check: {disposition: not-in-enclave, reason: "No EC2 instances / SSM managed nodes in the enclave."}
